nav_grasp_mission:
  ros__parameters:
    # Fail-closed public default. Copy this file to mission.local.yaml, measure
    # the target in your own map, and explicitly set this flag to true.
    target_pose_configured: false
    # Map-frame [x, y, yaw_rad]. Never commit a site-specific live target here.
    target_pose_xyyaw: [0.0, 0.0, 0.0]

    map_frame: map
    base_frame: base_link
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel
    navigation_action_name: /navigate_to_pose

    # Existing visual_grasp_ws API. Target color remains configured there.
    plan_pick_service: /visual_grasp/plan_pick
    execute_pick_service: /visual_grasp/execute_full_pick
    execution_state_topic: /visual_grasp/execution_state

    dependency_timeout_s: 30.0
    dependency_poll_period_s: 0.2
    nav_goal_response_timeout_s: 10.0
    navigation_timeout_s: 240.0
    service_response_timeout_s: 5.0
    # A single empty detector frame is not an error. Retry planning throughout
    # this window and proceed immediately once a valid target is available.
    target_detection_window_s: 15.0
    target_detection_retry_period_s: 0.5
    pick_execution_timeout_s: 120.0

    # The arm is called only after fresh odometry remains below both limits.
    base_settle_time_s: 1.5
    base_settle_timeout_s: 20.0
    odom_stale_timeout_s: 1.0
    max_base_linear_speed_mps: 0.02
    max_base_angular_speed_rps: 0.03
