ekf_filter_node:
  ros__parameters:

    frequency: 50.0
    sensor_timeout: 0.2

    two_d_mode: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    transform_time_offset: 0.0
    transform_timeout: 0.2

    # 原始轮式里程计
    odom0: /wheel/odom

    # 只使用轮式里程计的前向速度
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, false,
      false, false, false
    ]

    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU
    imu0: /imu

    # 使用IMU的yaw和绕Z轴角速度
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, true,
      false, false, false
    ]

    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 20

    print_diagnostics: true